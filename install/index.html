<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude ＋ 第二大腦：從零開始安裝指南</title>
<meta name="description" content="一步一步跟著做，把 Claude 桌面版、VS Code、Git、GitHub、Vercel 和你自己的第二大腦（含三層雲端備份）全部裝好。">
<meta name="robots" content="noindex">
<style>
:root{
  --ivory:#F4EFE6;
  --ivory-2:#EDE5D8;
  --navy:#13293D;
  --navy-soft:#2A4560;
  --gold:#C9A24B;
  --gold-deep:#7A5E28;
  --card:#FFFFFF;
  --line:#E2D9C9;
  --muted:#6B6154;
  --red:#B3261E;
  --red-bg:#FBEDEC;
  --green:#2E6B4F;
  --green-bg:#EAF3EE;
  --blue-bg:#EDF2F7;
  --radius:14px;
  --mono:"Cascadia Mono","SF Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  background:var(--ivory);
  color:var(--navy);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  line-height:1.75;
  font-size:16px;
  padding-bottom:80px;
}

/* ---------- header ---------- */
.hero{
  background:var(--navy);
  color:var(--ivory);
  padding:44px 20px 36px;
  text-align:center;
}
.hero .kicker{
  color:var(--gold);
  font-size:13px;letter-spacing:.22em;font-weight:700;
  text-transform:uppercase;margin-bottom:14px;
}
.hero h1{font-size:31px;line-height:1.35;font-weight:800;margin-bottom:14px}
.hero h1 span{color:var(--gold)}
.hero p{max-width:620px;margin:0 auto;color:#CFC5B4;font-size:15.5px}
.hero .meta{
  margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.hero .meta span{
  background:rgba(255,255,255,.08);border:1px solid rgba(201,162,75,.35);
  border-radius:999px;padding:5px 14px;font-size:13px;color:#E5DCCB;
}

/* ---------- sticky bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;
  background:rgba(244,239,230,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar-inner{
  max-width:900px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.osswitch{display:flex;background:var(--ivory-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.osswitch button{
  border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:14px;font-weight:700;color:var(--muted);
  padding:6px 18px;border-radius:999px;transition:.15s;
}
.osswitch button.active{background:var(--navy);color:#fff}
.progwrap{flex:1;min-width:150px;display:flex;align-items:center;gap:10px}
.progbar{flex:1;height:8px;background:var(--ivory-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .3s}
.progtext{font-size:13px;font-weight:700;color:var(--gold-deep);white-space:nowrap}
.resetbtn{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;
}
.resetbtn:hover{background:var(--ivory-2)}

/* ---------- nav chips ---------- */
.navchips{max-width:900px;margin:22px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.navchips a{
  text-decoration:none;color:var(--navy);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:600;
}
.navchips a:hover{border-color:var(--gold);color:var(--gold-deep)}

/* ---------- layout ---------- */
main{max-width:900px;margin:0 auto;padding:0 16px}
.chapter{margin-top:52px}
.chapter-head{
  border-left:5px solid var(--gold);padding-left:16px;margin-bottom:8px;
}
.chapter-head .num{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--gold-deep)}
.chapter-head h2{font-size:25px;font-weight:800;line-height:1.4;margin-top:2px}
.chapter-intro{color:var(--muted);font-size:15px;margin:10px 0 22px;padding-left:21px}

/* ---------- step card ---------- */
.step{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 20px 18px;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(19,41,61,.05);
  transition:.2s;
}
.step.done{background:#FAFDFB;border-color:#BFD9CB}
.step-top{display:flex;gap:12px;align-items:flex-start}
.step-check{
  appearance:none;-webkit-appearance:none;
  flex:0 0 auto;width:24px;height:24px;margin-top:3px;
  border:2px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;position:relative;
}
.step-check:checked{background:var(--green);border-color:var(--green)}
.step-check:checked::after{
  content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
}
.step-title{font-size:18px;font-weight:800;line-height:1.5;flex:1}
.step-title .tag{
  display:inline-block;vertical-align:middle;margin-left:8px;
  font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--ivory-2);color:var(--muted);border:1px solid var(--line);
}
.step-title .tag.win{background:var(--blue-bg);color:#2A4560;border-color:#C9D6E2}
.step-title .tag.mac{background:#F3EDF7;color:#5B3E72;border-color:#DDCCE8}
.step-title .tag.must{background:var(--red-bg);color:var(--red);border-color:#EBC9C6}
.step-body{padding-left:36px;margin-top:8px}
.step-body>*+*{margin-top:12px}
.step-body p{font-size:15.5px}
.step-body ul,.step-body ol{padding-left:22px}
.step-body li{margin-top:6px;font-size:15.5px}
.step-body li::marker{color:var(--gold-deep);font-weight:700}
strong{font-weight:800}
.hl{background:linear-gradient(transparent 62%,rgba(201,162,75,.38) 62%);font-weight:700}

/* ---------- links & buttons ---------- */
a{color:var(--gold-deep)}
.golink{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--navy);color:#fff;text-decoration:none;
  font-size:14.5px;font-weight:700;padding:9px 17px;border-radius:10px;
  border:1px solid var(--navy);
}
.golink:hover{background:var(--navy-soft)}
.golink::after{content:"↗";font-size:13px;opacity:.75}
.golink.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.golink.ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- code ---------- */
.code{
  position:relative;border-radius:11px;
  padding:40px 52px 14px 17px;overflow-x:auto;
  border-left:5px solid transparent;
}
/* 每個指令框頂端的「這段要貼去哪」標籤條 */
.code::before{
  position:absolute;top:0;left:0;right:0;
  padding:7px 14px 6px;font-size:12.5px;font-weight:800;letter-spacing:.02em;
  border-radius:0 11px 0 0;
}
/* ⌨️ 終端機：黑底藍標 */
.code.term{background:#0F1D29;border-left-color:#4A87C4}
.code.term::before{content:"⌨️ 貼到 PowerShell（黑色視窗）";background:#1B3145;color:#8DBBE4}
body.os-mac .code.term::before{content:"⌨️ 貼到「終端機」"}
.code.term pre{color:#E8E1D4}
.code.term .cmt{color:#8FA3B5}
/* 💬 Claude Code：褐底橘標 */
.code.cc{background:#2B1A11;border-left-color:#D97757}
.code.cc::before{content:"💬 貼給 Claude Code（不是貼到黑色視窗）";background:#3F2718;color:#EDA77C}
.code.cc pre{color:#F3E7DC}
.code.cc .cmt{color:#B08D77}
.code pre{
  font-family:var(--mono);font-size:13.5px;line-height:1.65;
  white-space:pre;
}
/* 圖例 */
.legend{
  display:grid;grid-template-columns:1fr 1fr;gap:11px;
  margin:26px 0 4px;
}
.legend div{
  border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.6;
  border-left:5px solid transparent;
}
.legend .lg-term{background:#0F1D29;color:#C9D9E8;border-left-color:#4A87C4}
.legend .lg-cc{background:#2B1A11;color:#EBD5C4;border-left-color:#D97757}
.legend b{display:block;font-size:14.5px;margin-bottom:3px}
.legend .lg-sub{margin-top:9px}
/* 🔴 .legend b 的特異性(0,1,1) 壓過 .win-only(0,1,0)，要明確蓋掉，
   否則 Mac 模式會留下一行沒有內文的孤兒標題 */
.legend b.win-only,.legend b.mac-only{display:none}
body.os-win .legend b.win-only{display:block}
body.os-mac .legend b.mac-only{display:block}
.legendwrap{margin:4px 0 30px}
.legend-title{font-size:15.5px;font-weight:800;color:var(--navy)}
code.inl2{
  font-family:var(--mono);font-size:12.5px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  padding:1px 5px;border-radius:4px;
}
.legend .lg-term b{color:#8DBBE4}
.legend .lg-cc b{color:#EDA77C}
@media(max-width:640px){ .legend{grid-template-columns:1fr} }
.copy{
  position:absolute;top:33px;right:9px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#E8E1D4;font:inherit;font-size:12px;font-weight:700;
  padding:5px 11px;border-radius:7px;cursor:pointer;
}
.copy:hover{background:rgba(201,162,75,.3);border-color:var(--gold)}
.copy.ok{background:var(--green);border-color:var(--green);color:#fff}
code.inl{
  font-family:var(--mono);font-size:13.5px;
  background:var(--ivory-2);border:1px solid var(--line);
  padding:1px 6px;border-radius:5px;color:var(--navy);
}

/* ---------- callouts ---------- */
.note{border-radius:11px;padding:13px 15px;font-size:14.5px;line-height:1.7;border:1px solid}
.note b{display:block;margin-bottom:3px;font-size:14.5px}
.note.warn{background:var(--red-bg);border-color:#EBC9C6;color:#7A1C16}
.note.warn b{color:var(--red)}
.note.tip{background:var(--green-bg);border-color:#C4DDD0;color:#1F4C38}
.note.tip b{color:var(--green)}
.note.info{background:var(--blue-bg);border-color:#C9D6E2;color:#294057}
.note.info b{color:var(--navy)}

/* ---------- verify block ---------- */
.verify{
  background:var(--ivory-2);border:1px dashed var(--gold);border-radius:11px;padding:13px 15px;font-size:14.5px;
}
.verify b{color:var(--gold-deep);display:block;margin-bottom:4px}

/* ---------- ask-claude block ---------- */
.askclaude{border:0;padding:0}
.askclaude .ac-head{display:none}

/* ---------- os visibility ---------- */
.win-only,.mac-only{display:none}
body.os-win .win-only{display:block}
body.os-mac .mac-only{display:block}
body.os-win li.win-only,body.os-mac li.mac-only{display:list-item}
body.os-win span.win-only,body.os-mac span.mac-only{display:inline}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14.5px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--ivory-2);font-weight:800;font-size:13.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* ---------- 步驟卡裡的「備援」摺疊區 ---------- */
.step-body details{background:var(--ivory-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.step-body details[open]{border-color:var(--gold)}
.step-body summary{font-size:14px;font-weight:700;color:var(--muted)}
.step-body details[open] summary{color:var(--gold-deep);margin-bottom:6px}
.step-body details .ans>*+*{margin-top:11px}

/* ---------- faq ---------- */
details{
  background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:13px 16px;margin-bottom:9px;
}
details[open]{border-color:var(--gold)}
summary{
  cursor:pointer;font-weight:700;font-size:15.5px;list-style:none;
  display:flex;justify-content:space-between;gap:12px;align-items:center;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--gold-deep);font-weight:800;flex:0 0 auto}
details[open] summary::after{content:"－"}
details .ans{margin-top:11px;font-size:15px;color:#33475C}
details .ans>*+*{margin-top:10px}

/* ---------- footer ---------- */
footer{
  margin-top:64px;padding:30px 16px;text-align:center;
  border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;
}
footer strong{color:var(--navy)}

@media(max-width:640px){
  .hero{padding:34px 16px 30px}
  .hero h1{font-size:24px}
  .chapter-head h2{font-size:21px}
  .step{padding:16px 15px 14px}
  .step-body{padding-left:0;margin-top:12px}
  .step-title{font-size:16.5px}
  .code{padding:38px 15px 42px 15px}
  .copy{top:auto;bottom:8px;right:9px}
  .code::before{font-size:12px;padding:7px 12px 6px}
  .progtext{display:none}
  .bar-inner{padding:8px 12px;gap:10px;flex-wrap:nowrap}
  .osswitch button{padding:5px 12px;font-size:13px}
  .resetbtn{display:none}
  .navchips{margin-top:16px}
  .navchips a{padding:6px 12px;font-size:13px}
}
.footreset{
  border:1px solid var(--line);background:#fff;color:var(--muted);
  font:inherit;font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer;margin-top:14px;
}
.footreset:hover{border-color:var(--gold);color:var(--gold-deep)}
</style>

<style>

<script>

function initGuide(){
  var KEY = 'meowdad-install-guide-v1';

  /* ---------- OS 切換 ---------- */
  var osBtns = document.querySelectorAll('.osswitch button');
  function setOS(os){
    document.body.classList.remove('os-win','os-mac');
    document.body.classList.add('os-' + os);
    osBtns.forEach(function(b){ b.classList.toggle('active', b.dataset.os === os); });
    /* 按鈕類的 win-only/mac-only 用 inline-flex 才不會跑版 */
    document.querySelectorAll('a.golink.win-only').forEach(function(e){
      e.style.display = (os === 'win') ? 'inline-flex' : 'none';
    });
    document.querySelectorAll('a.golink.mac-only').forEach(function(e){
      e.style.display = (os === 'mac') ? 'inline-flex' : 'none';
    });
    try{ localStorage.setItem(KEY + '-os', os); }catch(e){}
  }
  osBtns.forEach(function(b){
    b.addEventListener('click', function(){ setOS(b.dataset.os); });
  });
  var savedOS = null;
  try{ savedOS = localStorage.getItem(KEY + '-os'); }catch(e){}
  if(!savedOS){
    savedOS = /Mac|iPhone|iPad/i.test(navigator.platform + navigator.userAgent) ? 'mac' : 'win';
  }
  setOS(savedOS);

  /* ---------- 進度 ---------- */
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var fill = document.getElementById('progfill');
  var text = document.getElementById('progtext');
  var state = {};
  try{ state = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ state = {}; }

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function render(){
    var done = 0;
    steps.forEach(function(s){
      var on = !!state[s.dataset.key];
      s.classList.toggle('done', on);
      s.querySelector('.step-check').checked = on;
      if(on) done++;
    });
    var pct = steps.length ? Math.round(done / steps.length * 100) : 0;
    fill.style.width = pct + '%';
    text.textContent = done + ' / ' + steps.length;
  }
  steps.forEach(function(s){
    s.querySelector('.step-check').addEventListener('change', function(e){
      state[s.dataset.key] = e.target.checked;
      save(); render();
    });
  });
  function doReset(){
    if(confirm('確定要把所有打勾清掉重來嗎？')){
      state = {}; save(); render();
    }
  }
  ['resetbtn','resetbtn2'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('click', doReset);
  });
  render();

  /* ---------- 複製按鈕 ---------- */
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click', function(){
      var pre = btn.parentElement.querySelector('pre');
      /* 只複製真正要執行的內容：把註解行（.cmt）連同它後面那個換行一起拿掉，
         但不動其他空行（「貼給 Claude」那種多段落的提示詞要保留原樣）。 */
      var txt = '';
      var dropNL = false;
      Array.prototype.forEach.call(pre.childNodes, function(n){
        if(n.nodeType === 1 && n.className && String(n.className).indexOf('cmt') !== -1){
          dropNL = true; return;
        }
        var t = n.textContent || '';
        if(dropNL){ t = t.replace(/^\n/, ''); dropNL = false; }
        txt += t;
      });
      txt = txt.replace(/^\n+/, '').replace(/\s+$/, '');
      var done = function(){
        btn.textContent = '已複製 ✓';
        btn.classList.add('ok');
        setTimeout(function(){ btn.textContent = '複製'; btn.classList.remove('ok'); }, 1800);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, fallback);
      }else{ fallback(); }
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = txt;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); done(); }catch(e){ alert('複製失敗，請手動選取'); }
        document.body.removeChild(ta);
      }
    });
  });
}

      var mat = await subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      var key = await subtle.deriveKey(
        { name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iter, hash:'SHA-256' },
        mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      var plain = await subtle.decrypt({ name:'AES-GCM', iv:b64(DATA.iv) }, key, b64(DATA.ct));
      var html = new TextDecoder().decode(plain);
      app.innerHTML = html;
      gate.style.display = 'none';
      try{ localStorage.setItem(KEYPASS, pass); }catch(e){}
      if(typeof initGuide === 'function') initGuide();
      return true;
    }catch(e){
      if(!silent){
        msg.className = 'gate-msg err';
        msg.textContent = '密碼不對，再試一次';
        input.value = '';
        input.focus();
      }
      try{ localStorage.removeItem(KEYPASS); }catch(e2){}
      return false;
    }
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var v = input.value.trim();
    if(!v) return;
    btn.disabled = true;
    msg.className = 'gate-msg';
    msg.textContent = '解鎖中…';
    var ok = await unlock(v, false);
    if(!ok){ btn.disabled = false; }
  });

  // 之前解過就自動進去，不用每次打
  var saved = null;
  try{ saved = localStorage.getItem(KEYPASS); }catch(e){}
  if(saved){ unlock(saved, true); }
})();
</script>
</body>
</html>
