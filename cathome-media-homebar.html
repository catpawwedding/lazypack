<!--
  首頁「媒體採訪」區塊　v3（2026-08-11 第三版）
  放置位置：首頁「為什麼把房子交給喵爸」之後、「房市知識」之前。

  v2 被評：①「媒體採訪」四個字太小不明顯 ②整塊色調不顯眼
           ③ 引言前面兩個逗號很醜 ④ 字體有大有小、層級亂
  v3 改法：
  ① 小標籤改成「大標題＋副標」的正規階層 —— 標題 34px、副標 17px
  ② 加金色上下框線 + 更深的漸層 + 中央柔光，整塊變成「被框起來的獎章區」
  ③ 🔴 拿掉 CSS 的 `content:"\201C"` 英文引號 —— 中文字體會把它渲染成
     兩個逗號，非常醜。改用中文「」直接寫在文字裡。以後所有中文引言都照這樣做。
  ④ 字級階層定死：標題 34 > 媒體名 26 > 引言 24 > 出處 14 > 副標 17

  🔴 引言逐字照抄 Money 錢雜誌專訪，不要改字。
  🔴 首頁只放不會過期的引言（新青安那種有時效的留在 /media 內頁並標年份）。

  ⚠️ 上線前搜尋 https://pack.cathome.tw/cathome-media/photo1.jpg 換成媒體庫網址（目前版本已不需要圖，保留變數以防未來加圖）。
-->
<style>
.mb{--navy:#0A1724;--navy2:#16324B;--ivory:#F4EFE6;--gold:#C9A24B;--goldlt:#E3C176;

.mb *{box-sizing:border-box}

.mb .mb-link{display:block;text-decoration:none;color:inherit;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 140% at 50% 0%, rgba(201,162,75,.16) 0%, rgba(201,162,75,0) 55%),
    linear-gradient(165deg,#0A1724 0%,#13293D 55%,#16324B 100%);
  border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);
  padding:44px 20px 40px}
.mb .mb-in{max-width:920px;margin:0 auto;text-align:center;position:relative;z-index:1}

/* ① 大標題階層 */
.mb .mb-kicker{font-size:13px;letter-spacing:.42em;color:var(--goldlt);font-weight:800;margin:0 0 12px}
.mb .mb-h{font-size:34px;line-height:1.3;font-weight:900;color:#fff;margin:0 0 10px;letter-spacing:.03em}
.mb .mb-sub{font-size:17px;color:#C3D2E0;margin:0 0 26px}

/* ② 媒體名牆 */
.mb .mb-wall{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 34px;
  padding:22px 0;border-top:1px solid rgba(201,162,75,.3);border-bottom:1px solid rgba(201,162,75,.3)}
.mb .mb-wall span{font-size:26px;font-weight:900;color:#fff;letter-spacing:.03em}

/* ③ 引言：用中文「」，不用 CSS 英文引號 */
.mb .mb-quote{max-width:720px;margin:28px auto 0}
.mb .mb-quote p{margin:0 0 12px;font-size:24px;line-height:1.6;font-weight:800;color:var(--goldlt)}
.mb .mb-quote cite{font-style:normal;font-size:14px;color:#9FB2C4;letter-spacing:.03em}

/* ④ CTA */
.mb .mb-more{margin:28px 0 0}
.mb .mb-more span{display:inline-block;background:var(--gold);color:#160F02;font-weight:900;
  font-size:17px;padding:15px 36px;border-radius:999px;letter-spacing:.03em;
  box-shadow:0 6px 18px rgba(201,162,75,.28)}
.mb .mb-link:hover .mb-more span{background:var(--goldlt)}

@media(max-width:640px){
  .mb .mb-link{padding:32px 16px 30px}
  .mb .mb-h{font-size:25px}
  .mb .mb-sub{font-size:15px;margin-bottom:20px}
  .mb .mb-wall{gap:8px 18px;padding:16px 0}
  .mb .mb-wall span{font-size:18px}
  .mb .mb-quote{margin-top:20px}
  .mb .mb-quote p{font-size:19px}
  .mb .mb-more span{font-size:15.5px;padding:13px 26px}
}
</style>
