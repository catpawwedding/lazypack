<style>
  .cwfab{position:fixed;right:18px;bottom:20px;z-index:99990;display:flex;flex-direction:column;gap:13px}
  .cwfab a{position:relative;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .16s ease;text-decoration:none}
  .cwfab a:hover{transform:scale(1.09)}
  .cwfab a svg{width:27px;height:27px;display:block}
  .cwfab .fab-book{background:#ff6a3d}
  .cwfab .fab-line{background:#06c755}
  .cwfab .fab-tel{background:#2c6cb0}
  .cwfab .lbl{position:absolute;right:66px;top:50%;transform:translateY(-50%);background:#13314f;color:#fff;font:500 14px 'Noto Sans TC',system-ui,sans-serif;padding:7px 13px;border-radius:9px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .16s ease}
  .cwfab .lbl::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);border:5px solid transparent;border-left-color:#13314f}
  .cwfab a:hover .lbl{opacity:1}
  .cwfab .fab-line::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(6,199,85,.5);animation:cwpulse 2.2s infinite}
  @keyframes cwpulse{0%{box-shadow:0 0 0 0 rgba(6,199,85,.5)}70%{box-shadow:0 0 0 14px rgba(6,199,85,0)}100%{box-shadow:0 0 0 0 rgba(6,199,85,0)}}
  @media(max-width:900px){
    .cwfab{right:13px;bottom:15px;gap:11px}
    .cwfab a{width:52px;height:52px}
    .cwfab a svg{width:25px;height:25px}
    .cwfab .lbl{display:none}
  }
</style>
<div class="cwfab" aria-label="快速聯絡喵爸">
  <a class="fab-book" href="https://book.cathome.tw" target="_blank" aria-label="線上預約" title="線上預約">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="15" rx="2.2"/><path d="M4 10h16M8.5 3.2v4M15.5 3.2v4"/></svg>
    <span class="lbl">線上預約</span></a>
  <a class="fab-line" href="https://line.me/R/ti/p/@056ohivi" target="_blank" aria-label="LINE 諮詢" title="LINE 免費諮詢">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 4.2c-4.5 0-8.2 2.96-8.2 6.6 0 3.27 2.93 6 6.89 6.52.27.06.63.18.72.4.08.2.05.52.03.72l-.12.7c-.03.2-.16.8.7.44 3.05-1.34 4.93-2.84 6.06-4.34l-.5-.36c1.12-.83 1.82-1.94 1.82-4.08 0-3.64-3.65-6.6-8.12-6.6z"/></svg>
    <span class="lbl">LINE 諮詢</span></a>
  <a class="fab-tel" href="tel:0925842111" aria-label="撥打電話" title="撥打電話 0925-842-111">

    <span class="lbl">撥打電話</span></a>

<style>
  #cwTop{position:fixed;left:20px;bottom:24px;z-index:99980;width:48px;height:48px;border-radius:50%;background:#13314f;color:#fff;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .25s,transform .25s,visibility .25s,background .18s}
  #cwTop.show{opacity:1;visibility:visible;transform:translateY(0)}
  #cwTop:hover{background:#1f4d80;transform:translateY(-2px)}
  #cwTop svg{width:22px;height:22px;display:block}
  @media(max-width:680px){#cwTop{left:14px;bottom:16px;width:44px;height:44px}}
</style>
<button id="cwTop" aria-label="回到頂端" title="回到頂端"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
<script>document.addEventListener('DOMContentLoaded',function(){try{var t=document.getElementById('cwTop');if(!t)return;function f(){t.classList.toggle('show',(window.scrollY||document.documentElement.scrollTop)>320);}window.addEventListener('scroll',f,{passive:true});f();t.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});}catch(e){}});</script>
