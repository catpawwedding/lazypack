<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵爸 Lazypack · Hello</title>
<style>
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #FAF8F4;
    color: #2C2A26;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #FFF;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    max-width: 420px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: #B89968;
    color: #FFF;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 12px;
  }
  p {
    color: #6B6660;
    line-height: 1.7;
    font-size: 15px;
    margin: 0;
  }
  .check {
    font-size: 48px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <div class="badge">DEPLOY TEST</div>
    <h1>部署測試成功</h1>
    <p>如果你看到這一頁,代表 Claude 透過 GitHub API 成功把檔案推到你的 lazypack repo,GitHub Pages 也正常運作。<br><br>下一步可以開始用部署技能上線真正的懶人包了。</p>
  </div>
</body>
</html>
