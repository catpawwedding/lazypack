<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>複數店查詢｜喵爸聯盟名單</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:#f4f1ec;color:#2b2b2b;min-height:100vh;padding:20px 14px 40px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:21px;text-align:center;color:#1a3a5c;margin-bottom:4px}
  .sub{text-align:center;font-size:12.5px;color:#8a8377;margin-bottom:18px}
  .card{background:#fff;border:1px solid #e5dfd5;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:14px}
  textarea{width:100%;min-height:96px;border:1.5px solid #d8d0c2;border-radius:10px;padding:12px;font-size:16px;font-family:inherit;resize:vertical;outline:none;line-height:1.6}
  textarea:focus{border-color:#1a3a5c}
  .hint{font-size:12px;color:#a09884;margin-top:6px}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  button{flex:1;border:none;border-radius:10px;padding:13px 0;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-main{background:#1a3a5c;color:#fff}
  .btn-main:active{background:#122a44}
  .btn-clear{flex:0 0 84px;background:#eee7db;color:#6b6255}
  #result{display:none}
  .res-line{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-top:1px dashed #e5dfd5;font-size:15px;line-height:1.5}
  .res-line:first-child{border-top:none}
  .res-ico{font-size:20px;line-height:1.2;flex:0 0 auto}
  .res-body{flex:1;min-width:0}
  .res-q{font-weight:700;word-break:break-all}
  .res-match{font-size:13px;color:#1f7a48;margin-top:2px}
  .res-no{font-size:13px;color:#b05a3c;margin-top:2px}
  .res-short{font-size:13px;color:#a09884;margin-top:2px}
  .summary{text-align:center;font-size:14px;font-weight:700;padding:9px;border-radius:9px;margin-bottom:10px}
  .sum-hit{background:#effaf3;color:#1f7a48;border:1px solid #bfe6cf}
  .sum-miss{background:#fdf3f3;color:#8a2f2f;border:1px solid #eed4d4}
  .sum-mix{background:#fdf8ec;color:#8a6d2f;border:1px solid #eadfc0}
  details{margin-top:4px}
  summary{cursor:pointer;font-size:14px;font-weight:700;color:#1a3a5c;padding:6px 2px;user-select:none}
  .brand{margin:10px 0 4px;font-size:13.5px;font-weight:800}
  .brand.yc{color:#8a2f2f}.brand.uc{color:#c2571d}.brand.yi{color:#1f7a48}.brand.tc{color:#1a5c8a}
  .store{font-size:13.5px;color:#4a4438;padding:4px 0 4px 12px;border-left:3px solid #eee7db;margin:3px 0;line-height:1.45}
  .cnt{font-weight:400;color:#a09884;font-size:12px}
  .foot{text-align:center;font-size:11.5px;color:#b3ab9e;margin-top:18px;line-height:1.7}
</style>
<script src="https://hub.cathome.tw/line-escape.js" defer></script>
</head>
<body>
<div class="wrap">
  <h1>🏘️ 複數店查詢</h1>
  <div class="sub">貼上店名，馬上告訴你是不是我們聯盟的複數店（共 32 家）</div>

  <div class="card">
    <textarea id="inp" placeholder="貼店名，例如：&#10;永慶內壢站前&#10;有巢氏房屋中壢SOGO加盟店&#10;（一次貼多行也可以，一行一家）" autofocus></textarea>
    <div class="hint">整行貼過來也行（店名混著業務姓名電話沒關係），一次查多家就一行一家。</div>
    <div class="btnrow">
      <button class="btn-main" onclick="run()">查詢</button>
      <button class="btn-clear" onclick="clr()">清除</button>
    </div>
  </div>

  <div class="card" id="result">
    <div id="summary"></div>
    <div id="lines"></div>
  </div>

  <div class="card">
    <details>
      <summary>📋 看完整名單（32 家）</summary>
      <div id="fulllist"></div>
    </details>
  </div>

  <div class="foot">名單同步自喵爸控台 MULTI_STORES（2026-07-06）<br>加店請找喵爸更新</div>
</div>

<script>
const MULTI_STORES=[
"永慶不動產體育園區云賀加盟店","永慶不動產鶯歌鳳鳴站前加盟店","永慶不動產鶯歌建國捷運加盟店","永慶不動產楊梅楊明國小加盟店",
"永慶不動產高鐵青塘園加盟店","永慶不動產桃園藝文同安加盟店","永慶不動產青埔IKEA加盟店","永慶不動產青埔A19捷運加盟店",
"永慶不動產林口民視中山加盟店","永慶不動產內壢站前加盟店","永慶不動產內壢忠孝吉富加盟店","永慶不動產中壢過嶺絢耀加盟店",
"永慶不動產中壢A22中豐加盟店","永慶不動產中路京懋一號加盟店",
"有巢氏房屋內壢環中加盟店","有巢氏房屋內壢車站加盟店","有巢氏房屋園區龍慈吉富加盟店","有巢氏房屋青埔A18高鐵加盟店",
"有巢氏房屋林口三井忠孝加盟店","有巢氏房屋中壢環中加盟店","有巢氏房屋中壢後站加盟店","有巢氏房屋中壢SOGO加盟店",
"有巢氏房屋小檜溪自強加盟店","有巢氏房屋平鎮環南加盟店",
"永義房屋桃園南崁台茂加盟店","永義房屋桃園中路吉安加盟店","永義房屋桃園大有寶山加盟店","永義房屋青埔A19領航加盟店",
"永義房屋中正G10加盟店","永義房屋大竹上興公園加盟店",
"台慶不動產龍潭宏觀加盟店","台慶不動產桃園風禾公園加盟店"];

// 比對邏輯與喵爸控台完全相同
const msNorm=s=>String(s||"").replace(/\s|　|不動產|房屋|加盟店|直營店/g,"").toUpperCase();
const MS_NORM=MULTI_STORES.map(msNorm);
function matchStore(name){
  const n=msNorm(name);
  if(!n||n.length<4)return{status:"short"};
  for(let i=0;i<MS_NORM.length;i++){
    const x=MS_NORM[i];
    if(x===n||x.includes(n)||n.includes(x))return{status:"hit",store:MULTI_STORES[i]};
  }
  return{status:"miss"};
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function run(){
  const lines=document.getElementById("inp").value.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return;
  let hit=0,miss=0,short=0,html="";
  for(const ln of lines){
    const r=matchStore(ln);
    if(r.status==="hit"){hit++;
      html+=`<div class="res-line"><span class="res-ico">✅</span><div class="res-body"><div class="res-q">${esc(ln)}</div><div class="res-match">是我們的複數店 → ${esc(r.store)}</div></div></div>`;
    }else if(r.status==="short"){short++;
      html+=`<div class="res-line"><span class="res-ico">⚠️</span><div class="res-body"><div class="res-q">${esc(ln)}</div><div class="res-short">字太少不好判斷，請貼完整一點的店名（至少 4 個字）</div></div></div>`;
    }else{miss++;
      html+=`<div class="res-line"><span class="res-ico">❌</span><div class="res-body"><div class="res-q">${esc(ln)}</div><div class="res-no">不在複數店名單裡</div></div></div>`;
    }
  }
  const sum=document.getElementById("summary");
  if(lines.length===1){
    sum.className="summary "+(hit?"sum-hit":(short?"sum-mix":"sum-miss"));
    sum.textContent=hit?"✅ 是我們的複數店":(short?"⚠️ 請貼完整一點的店名":"❌ 不是複數店");
  }else{
    sum.className="summary "+(miss===0&&short===0?"sum-hit":(hit===0?"sum-miss":"sum-mix"));
    sum.textContent=`共 ${lines.length} 家：✅ ${hit} 家是複數店、❌ ${miss} 家不是`+(short?`、⚠️ ${short} 家看不出來`:"");
  }
  document.getElementById("lines").innerHTML=html;
  document.getElementById("result").style.display="block";
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function clr(){
  document.getElementById("inp").value="";
  document.getElementById("result").style.display="none";
  document.getElementById("inp").focus();
}

document.getElementById("inp").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!document.getElementById("inp").value.includes("\n")){e.preventDefault();run();}
});

// 完整名單（依品牌分組）
(function(){
  const groups=[["永慶不動產","yc"],["有巢氏房屋","uc"],["永義房屋","yi"],["台慶不動產","tc"]];
  let h="";
  for(const[br,cls]of groups){
    const list=MULTI_STORES.filter(s=>s.startsWith(br));
    h+=`<div class="brand ${cls}">${br} <span class="cnt">（${list.length} 家）</span></div>`;
    for(const s of list)h+=`<div class="store">${esc(s)}</div>`;
  }
  document.getElementById("fulllist").innerHTML=h;
})();
</script>
</body>
</html>
