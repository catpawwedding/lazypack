<title>🎉 賀榜產生器｜貼訊息 → 下載賀成交 PPT</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background: #faf6f2; color: #333; padding: 16px; max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 12px 0 4px; color: #b71c1c; }
  .sub { color: #888; font-size: .85rem; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .panel h2 { font-size: 1.05rem; margin-bottom: 10px; color: #b71c1c; }
  textarea { width: 100%; min-height: 180px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: .95rem; font-family: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid #ef9a9a; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  label { font-size: .9rem; color: #555; }
  input[type=date] { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: .95rem; font-family: inherit; }
  button { border: 0; border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-main { background: #d32f2f; color: #fff; }
  .btn-main:active { background: #b71c1c; }
  .btn-dl { background: #2e7d32; color: #fff; width: 100%; padding: 16px; font-size: 1.15rem; }
  .btn-dl:disabled { background: #bbb; cursor: not-allowed; }
  .btn-sub { background: #eee; color: #444; padding: 8px 14px; font-size: .85rem; }
  .card { border: 1px solid #eee; border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .slide-preview { background: #FF4040; text-align: center; padding: 14px 10px 10px; color: #000; position: relative; }
  .slide-preview .he { font-size: 1.9rem; font-weight: 900; letter-spacing: .1em; }
  .slide-preview .poppers { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; }
  .slide-preview .poppers img { width: 34px; height: 34px; }
  .slide-preview .poppers img.l { transform: scaleX(-1); }
  .slide-preview .t { font-size: 1.25rem; font-weight: 800; margin-top: 8px; word-break: break-all; }
  .slide-preview .p { font-size: 1.05rem; font-weight: 700; }
  .slide-preview .band { font-size: 1.15rem; font-weight: 700; margin-top: 10px; }
  .fields { padding: 12px; display: grid; grid-template-columns: 5.2em 1fr; gap: 8px 6px; align-items: center; background: #fff; }
  .fields label { text-align: right; font-size: .85rem; }
  .fields input, .fields select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: .95rem; font-family: inherit; width: 100%; }
  .extra { grid-column: 1 / -1; color: #999; font-size: .8rem; }
  .card-actions { grid-column: 1 / -1; text-align: right; }
  .hint { color: #999; font-size: .8rem; margin-top: 8px; line-height: 1.6; }
  .count { font-weight: 700; color: #b71c1c; }
  footer { text-align: center; color: #bbb; font-size: .78rem; margin: 24px 0; }
  .empty { color: #aaa; text-align: center; padding: 20px 0; font-size: .9rem; }
</style>
<script src="https://hub.cathome.tw/line-escape.js" defer></script>

<body>
<h1>🎉 賀榜產生器</h1>
<div class="sub">貼上主管的成交訊息 → 自動排版 → 下載「賀成交」PPT｜純瀏覽器處理，資料不上傳</div>

<div class="panel">
  <h2>① 貼上成交訊息（可一次貼很多筆）</h2>
  <textarea id="raw" placeholder="開發：周媄仙
銷售：周媄仙
（幸福邊間二樓美寓）
建坪：27.29坪
成交：520萬

開發：張建明、徐惠娟
（體育園區稀有邊間透店）"></textarea>
  <div class="row">
    <button class="btn-main" id="btnParse">解析訊息</button>
    <label>早會日期：<input type="date" id="date"></label>
  </div>
  <div class="hint">看得懂的格式：「開發：」「銷售：」開頭的行＝人名；（括號）或單獨一行＝案名；建坪、成交價會自動略過（不上榜）。每筆用新的「開發：」分隔即可，不一定要空行。</div>
</div>

<div class="panel">
  <h2>② 檢查與修改（共 <span class="count" id="count">0</span> 筆）</h2>
  <div id="cards"><div class="empty">還沒有資料，先在上面貼訊息按「解析訊息」</div></div>
  <div class="row"><button class="btn-sub" id="btnAdd">＋ 手動加一筆</button></div>
</div>

<div class="panel">
  <h2>③ 下載</h2>
  <button class="btn-dl" id="btnDl" disabled>下載賀榜 PPT</button>
  <div class="hint">檔名自動用民國日期（例：賀榜 - 1150706.pptx）。字型「文鼎中特廣告體、王漢宗特圓體繁」要在開榜的電腦有安裝才會顯示，跟原本的賀榜檔一樣。</div>
</div>

<footer>中壢專業房仲喵爸｜內部工具</footer>

let cases = [];

const $ = (id) => document.getElementById(id);

// 預設日期：下一個（含今天的）星期一
(function initDate() {
  const d = new Date();
  const add = (8 - d.getDay()) % 7; // 週一=1
  d.setDate(d.getDate() + add);
  $("date").value = d.toISOString().slice(0, 10);
})();

function render() {
  const wrap = $("cards");
  wrap.innerHTML = "";
  $("count").textContent = cases.length;
  $("btnDl").disabled = cases.length === 0;
  if (!cases.length) {
    wrap.innerHTML = '<div class="empty">還沒有資料，先在上面貼訊息按「解析訊息」</div>';
    return;
  }
  cases.forEach((c, i) => {
    if (c.band === undefined) c.band = HebangCore.bandText(c.type);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="slide-preview">
        <div class="poppers"><img class="l" src="data:image/png;base64,${POPPER_B64}"><img src="data:image/png;base64,${POPPER_B64}"></div>
        <div class="he">賀成交</div>
        <div class="t"></div>
        <div class="p p-dev"></div>
        <div class="p p-sell"></div>
        <div class="band"></div>
      </div>
      <div class="fields">
        <label>案名</label><input data-k="title">
        <label>開發</label><input data-k="dev">
        <label>銷售</label><input data-k="sell" placeholder="（可留空）">
        <label>物件類型</label><select data-k="type">${HebangCore.TYPES.map(t => `<option${t === c.type ? " selected" : ""}>${t}</option>`).join("")}</select>
        <label>榜尾文字</label><input data-k="band">
        ${c.extra && c.extra.length ? `<div class="extra">訊息備註（不上榜）：${c.extra.join("｜")}</div>` : ""}
        <div class="card-actions"><button class="btn-sub" data-del>刪除這筆</button></div>
      </div>`;
    const sync = () => {
      card.querySelector(".t").textContent = c.title || "（案名）";
      card.querySelector(".p-dev").textContent = c.dev ? "開發：" + c.dev : "";
      card.querySelector(".p-sell").textContent = c.sell ? "銷售：" + c.sell : "";
      card.querySelector(".band").textContent = c.band;
    };
    card.querySelectorAll("[data-k]").forEach(el => {
      const k = el.dataset.k;
      if (el.tagName === "INPUT") el.value = c[k] || "";
      el.addEventListener("input", () => {
        c[k] = el.value;
        if (k === "type") { c.band = HebangCore.bandText(c.type); card.querySelector('[data-k="band"]').value = c.band; }
        sync();
      });
    });
    card.querySelector("[data-del]").addEventListener("click", () => { cases.splice(i, 1); render(); });
    sync();
    wrap.appendChild(card);
  });
}

$("btnParse").addEventListener("click", () => {
  const parsed = HebangCore.parseMessages($("raw").value);
  if (!parsed.length) { alert("看不出任何一筆成交，檢查一下訊息裡有沒有「開發：」或案名"); return; }
  cases = parsed;
  render();
  $("cards").scrollIntoView({ behavior: "smooth" });
});

$("btnAdd").addEventListener("click", () => {
  cases.push({ title: "", dev: "", sell: "", type: "大樓", band: "成交大樓乙戶", extra: [] });
  render();
});

$("btnDl").addEventListener("click", async () => {
  const valid = cases.filter(c => c.title || c.dev);
  if (!valid.length) { alert("沒有可產出的資料"); return; }
  const pptx = new PptxGenJS();
  HebangCore.buildDeck(pptx, valid, POPPER_B64);
  const stamp = HebangCore.rocStamp($("date").value) || "未命名";
  await pptx.writeFile({ fileName: `賀榜 - ${stamp}.pptx` });
});
</script>
</body>
</html>
