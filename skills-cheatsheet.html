<head>
<meta charset="UTF-8">

<title>喵爸 Claude 技能速查表</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d24;
    --card2:#22262f;
    --line:#2d3340;
    --txt:#e8eaed;
    --sub:#9aa3b2;
    --accent:#ff8a3d;
    --accent2:#ffb066;
    --tag:#2a3140;
    --tagtxt:#cdd6e6;
    --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;
    padding:0 0 60px;
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#15181f 0%,rgba(21,24,31,.96) 100%);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:18px 16px 14px;
  }
  .title{font-size:20px;font-weight:800;letter-spacing:.5px;}
  .title span{color:var(--accent);}
  .subtitle{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .search-wrap{margin-top:12px;position:relative;}
  #search{
    width:100%;padding:12px 40px 12px 14px;font-size:15px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);outline:none;
  }
  #search:focus{border-color:var(--accent);}
  .clear{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    color:var(--sub);font-size:18px;cursor:pointer;padding:4px 8px;display:none;
  }
  .stat{font-size:12px;color:var(--sub);margin-top:8px;}
  .stat b{color:var(--accent2);}
  main{padding:8px 14px 0;max-width:760px;margin:0 auto;}
  .cat{margin-top:22px;}
  .cat-h{
    font-size:14px;font-weight:800;color:var(--accent2);
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
    padding-bottom:6px;border-bottom:1px dashed var(--line);
  }
  .cat-h .n{
    background:var(--accent);color:#13151a;border-radius:6px;
    font-size:11px;font-weight:800;padding:1px 7px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 14px 12px;margin-bottom:10px;
  }
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .name{font-size:15.5px;font-weight:800;color:var(--txt);}
  .code{font-size:11px;color:var(--accent);font-family:ui-monospace,Menlo,monospace;opacity:.85;}
  .desc{font-size:13px;color:var(--sub);margin:7px 0 10px;}
  .trig-label{font-size:11px;color:var(--sub);margin-bottom:5px;font-weight:700;}
  .trigs{display:flex;flex-wrap:wrap;gap:6px;}
  .trig{
    background:var(--tag);color:var(--tagtxt);font-size:12px;
    padding:5px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;transition:.12s;user-select:none;
  }
  .trig:active{transform:scale(.95);}
  .trig.copied{background:var(--accent);color:#13151a;border-color:var(--accent2);}
  .empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px;display:none;}
  footer{text-align:center;color:var(--sub);font-size:11.5px;margin-top:30px;padding:0 16px;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#13151a;font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:50;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<script src="https://hub.cathome.tw/line-escape.js" defer></script>
</head>
<body>

    {name:"度哥 AI 影片提示詞", code:"duge-ad-ai-video-prompt", desc:"把腳本轉成 Banana Pro 出圖 + Seedance 出影片的完整 AI 提示詞包。", trigs:["AI 影片提示詞","Banana Pro 提示詞","Seedance 提示詞","腳本變影片"]},
  ]},
  {cat:"九、金流 / 發票串接", skills:[
    {name:"EZPAY 電子發票", code:"ezpay-invoice", desc:"ezPay 電子發票 API 完整串接指引：開立/作廢/折讓/查詢/載具。", trigs:["電子發票","ezPay","發票 API","載具","手機條碼"]},
    {name:"藍新金流", code:"newebpay-integration", desc:"NewebPay 金流串接：MPG 收款、定期定額、查詢、退款。", trigs:["藍新金流","NewebPay","金流串接","信用卡付款"]},
  ]},
];

const main = document.getElementById('main');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const clearBtn = document.getElementById('clear');
const toast = document.getElementById('toast');

function render(){
  main.innerHTML = DATA.map((c,ci)=>`
    <section class="cat" data-cat>
      <div class="cat-h"><span class="n">${c.skills.length}</span>${c.cat}</div>
      ${c.skills.map(s=>`
        <div class="card" data-search="${(s.name+' '+s.code+' '+s.desc+' '+s.trigs.join(' ')).toLowerCase()}">
          <div class="card-top">
            <div class="name">${s.name}</div>
            <div class="code">${s.code}</div>
          </div>
          <div class="desc">${s.desc}</div>
          <div class="trig-label">觸發詞（點一下複製）</div>
          <div class="trigs">
            ${s.trigs.map(t=>`<span class="trig" data-copy="${t.replace(/"/g,'&quot;')}">${t}</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </section>
  `).join('');
  bindCopy();
}

function bindCopy(){
  document.querySelectorAll('.trig').forEach(el=>{
    el.addEventListener('click',()=>{
      const txt = el.getAttribute('data-copy');
      copy(txt, el);
    });
  });
}

function copy(text, el){
  const done = ()=>{
    el.classList.add('copied');
    showToast('已複製：'+text);
    setTimeout(()=>el.classList.remove('copied'),900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  }else{ fallback(text,done); }
}
function fallback(text,done){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){}
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1300);
}

function filter(){
  const q = search.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block':'none';
  let any=false;
  document.querySelectorAll('section.cat').forEach(sec=>{
    let secVisible=false;
    sec.querySelectorAll('.card').forEach(card=>{
      const hit = !q || card.getAttribute('data-search').includes(q);
      card.style.display = hit ? '' : 'none';
      if(hit){secVisible=true;any=true;}
    });
    sec.style.display = secVisible ? '' : 'none';
  });
  empty.style.display = any ? 'none':'block';
}

search.addEventListener('input',filter);
clearBtn.addEventListener('click',()=>{search.value='';filter();search.focus();});

render();
</script>
</body>
</html>
