const main = document.getElementById('main');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const clearBtn = document.getElementById('clear');
const toast = document.getElementById('toast');
const nav = document.getElementById('nav');
const topBtn = document.getElementById('top');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  main.innerHTML = DATA.map(c=>`
    <section class="cat" id="${c.id}" data-cat>
      <div class="cat-h"><span class="n">${c.skills.length}</span>${c.cat}</div>
      ${c.skills.map(s=>`
        <div class="card" data-search="${esc((s.name+' '+s.code+' '+s.desc+' '+(s.flag||'')+' '+s.trigs.join(' ')).toLowerCase())}">
          <div class="card-top">
            <div class="name">${s.name}<span class="pkg">${s.pkg===1?'自建':s.pkg===2?'課程':'包 '+s.pkg}</span></div>
            <div class="code">${esc(s.code)}</div>
          </div>
          <div class="desc">${s.desc}</div>
          ${s.flag?`<div class="flag${s.dead?' dead':''}">${s.flag}</div>`:''}
          ${s.trigs.length?`<div class="trig-label">觸發詞（點一下複製）</div>
          <div class="trigs">
            ${s.trigs.map(t=>`<span class="trig" data-copy="${esc(t)}">${esc(t)}</span>`).join('')}
          </div>`:''}
        </div>
      `).join('')}
    </section>
  `).join('') + SYS.map((g,i)=>`
    <section class="cat" id="sys${i}" data-cat>
      <div class="cat-h"><span class="n">${g.items.length}</span>${g.t}</div>
      <div class="card" data-search="${esc((g.t+' '+g.note+' '+g.items.join(' ')).toLowerCase())}">
        <div class="desc">${g.note}</div>
        ${g.warn?`<div class="flag">${g.warn}</div>`:''}
        <div class="plain">${g.items.map(x=>x.startsWith('/')?`<code>${esc(x.split('｜')[0])}</code>${x.includes('｜')?' '+esc(x.split('｜')[1]):''}`:esc(x)).join('<br>')}</div>
      </div>
    </section>
  `).join('');

  nav.innerHTML = DATA.map(c=>`<a href="#${c.id}">${c.cat.replace(/^\S+\s/,'')}</a>`).join('')
    + `<a href="#sys0">系統內建</a>`;

  const total = DATA.reduce((a,c)=>a+c.skills.reduce((x,s)=>x+(s.n||1),0),0);
  document.getElementById('count').textContent = total;
  document.getElementById('catcount').textContent = DATA.length;
  bindCopy();
}

function bindCopy(){
  document.querySelectorAll('.trig').forEach(el=>{
    el.addEventListener('click',()=>copy(el.getAttribute('data-copy'), el));
  });
}

function copy(text, el){
  const done = ()=>{
    el.classList.add('copied');
    showToast('已複製：'+text);
    setTimeout(()=>el.classList.remove('copied'),900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  }else{ fallback(text,done); }
}
function fallback(text,done){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){}
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'),1300);
}

function filter(){
  const q = search.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block':'none';
  let any=false;
  document.querySelectorAll('section.cat').forEach(sec=>{
    let secVisible=false;
    sec.querySelectorAll('.card').forEach(card=>{
      const hit = !q || card.getAttribute('data-search').includes(q);
      card.style.display = hit ? '' : 'none';
      if(hit){secVisible=true;any=true;}
    });
    sec.style.display = secVisible ? '' : 'none';
  });
  empty.style.display = any ? 'none':'block';
}

search.addEventListener('input',filter);
clearBtn.addEventListener('click',()=>{search.value='';filter();search.focus();});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('scroll',()=>{
  topBtn.style.display = window.scrollY>600 ? 'flex':'none';
});

// 讓錨點跳轉不會被 sticky header 蓋住（header 高度會隨螢幕寬度變）
function syncHeaderH(){
  const h = document.querySelector('header').offsetHeight;
  document.documentElement.style.setProperty('--hh', (h+12)+'px');
}
window.addEventListener('resize', syncHeaderH);

render();
syncHeaderH();
</script>
