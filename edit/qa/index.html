<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動剪輯問卷：讓 CC 認識你</title>
<meta name="description" content="填 17 題，產生一段建檔提示詞，貼給自己的 Claude Code，之後每次剪片都照你的風格。">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="中壢專業房仲喵爸">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="自動剪輯問卷：讓 CC 認識你">
<meta property="og:description" content="填 17 題，產生一段建檔提示詞，貼給自己的 Claude Code，之後每次剪片都照你的風格。">
<meta property="og:url" content="https://pack.cathome.tw/edit/qa/">
<meta property="og:image" content="https://pack.cathome.tw/edit/qa/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/logo.png">
<meta name="line-login" content="on"><!-- 問卷在 LINE 裡能填，跳外部瀏覽器反而丟答案，所以 LINE 不提示；FB/IG 照舊 -->
<script src="https://hub.cathome.tw/line-escape.js" defer></script>
<style>
:root{
  --ivory:#F4EFE6;
  --ivory-2:#EDE5D8;
  --navy:#13293D;
  --navy-soft:#2A4560;
  --gold:#C9A24B;
  --gold-deep:#7A5E28;
  --card:#FFFFFF;
  --line:#E2D9C9;
  --muted:#6B6154;
  --red:#B3261E;
  --red-bg:#FBEDEC;
  --green:#2E6B4F;
  --green-bg:#EAF3EE;
  --blue-bg:#EDF2F7;
  --radius:14px;
  --mono:"Cascadia Mono","SF Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  background:var(--ivory);
  color:var(--navy);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  line-height:1.75;
  font-size:16px;
  padding-bottom:80px;
}

/* ---------- header ---------- */
.hero{
  background:var(--navy);
  color:var(--ivory);
  padding:44px 20px 36px;
  text-align:center;
}
.hero .kicker{
  color:var(--gold);
  font-size:13px;letter-spacing:.22em;font-weight:700;
  text-transform:uppercase;margin-bottom:14px;
}
.hero h1{font-size:31px;line-height:1.35;font-weight:800;margin-bottom:14px}
.hero h1 span{color:var(--gold)}
.hero p{max-width:620px;margin:0 auto;color:#CFC5B4;font-size:15.5px}
.hero .meta{
  margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.hero .meta span{
  background:rgba(255,255,255,.08);border:1px solid rgba(201,162,75,.35);
  border-radius:999px;padding:5px 14px;font-size:13px;color:#E5DCCB;
}

/* ---------- sticky bar ---------- */
.bar{
  position:sticky;top:0;z-index:50;
  background:rgba(244,239,230,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar-inner{
  max-width:900px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.osswitch{display:flex;background:var(--ivory-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.osswitch button{
  border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:14px;font-weight:700;color:var(--muted);
  padding:6px 18px;border-radius:999px;transition:.15s;
}
.osswitch button.active{background:var(--navy);color:#fff}
.progwrap{flex:1;min-width:150px;display:flex;align-items:center;gap:10px}
.progbar{flex:1;height:8px;background:var(--ivory-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-deep));transition:width .3s}
.progtext{font-size:13px;font-weight:700;color:var(--gold-deep);white-space:nowrap}
.resetbtn{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:12px;padding:5px 11px;border-radius:8px;cursor:pointer;
}
.resetbtn:hover{background:var(--ivory-2)}

/* ---------- nav chips ---------- */
.navchips{max-width:900px;margin:22px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.navchips a{
  text-decoration:none;color:var(--navy);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:600;
}
.navchips a:hover{border-color:var(--gold);color:var(--gold-deep)}

/* ---------- layout ---------- */
main{max-width:900px;margin:0 auto;padding:0 16px}
.chapter{margin-top:52px}
.chapter-head{
  border-left:5px solid var(--gold);padding-left:16px;margin-bottom:8px;
}
.chapter-head .num{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--gold-deep)}
.chapter-head h2{font-size:25px;font-weight:800;line-height:1.4;margin-top:2px}
.chapter-intro{color:var(--muted);font-size:15px;margin:10px 0 22px;padding-left:21px}

/* ---------- step card ---------- */
.step{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 20px 18px;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(19,41,61,.05);
  transition:.2s;
}
.step.done{background:#FAFDFB;border-color:#BFD9CB}
.step-top{display:flex;gap:12px;align-items:flex-start}
.step-check{
  appearance:none;-webkit-appearance:none;
  flex:0 0 auto;width:24px;height:24px;margin-top:3px;
  border:2px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;position:relative;
}
.step-check:checked{background:var(--green);border-color:var(--green)}
.step-check:checked::after{
  content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
}
.step-title{font-size:18px;font-weight:800;line-height:1.5;flex:1}
.step-title .tag{
  display:inline-block;vertical-align:middle;margin-left:8px;
  font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  background:var(--ivory-2);color:var(--muted);border:1px solid var(--line);
}
.step-title .tag.win{background:var(--blue-bg);color:#2A4560;border-color:#C9D6E2}
.step-title .tag.mac{background:#F3EDF7;color:#5B3E72;border-color:#DDCCE8}
.step-title .tag.must{background:var(--red-bg);color:var(--red);border-color:#EBC9C6}
.step-body{padding-left:36px;margin-top:8px}
.step-body>*+*{margin-top:12px}
.step-body p{font-size:15.5px}
.step-body ul,.step-body ol{padding-left:22px}
.step-body li{margin-top:6px;font-size:15.5px}
.step-body li::marker{color:var(--gold-deep);font-weight:700}
strong{font-weight:800}
.hl{background:linear-gradient(transparent 62%,rgba(201,162,75,.38) 62%);font-weight:700}

/* ---------- links & buttons ---------- */
a{color:var(--gold-deep)}
.golink{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--navy);color:#fff;text-decoration:none;
  font-size:14.5px;font-weight:700;padding:9px 17px;border-radius:10px;
  border:1px solid var(--navy);
}
.golink:hover{background:var(--navy-soft)}
.golink::after{content:"↗";font-size:13px;opacity:.75}
.golink.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.golink.ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- code ---------- */
.code{
  position:relative;border-radius:11px;
  padding:40px 52px 14px 17px;overflow-x:auto;
  border-left:5px solid transparent;
}
/* 每個指令框頂端的「這段要貼去哪」標籤條 */
.code::before{
  position:absolute;top:0;left:0;right:0;
  padding:7px 14px 6px;font-size:12.5px;font-weight:800;letter-spacing:.02em;
  border-radius:0 11px 0 0;
}
/* ⌨️ 終端機：黑底藍標 */
.code.term{background:#0F1D29;border-left-color:#4A87C4}
.code.term::before{content:"⌨️ 貼到 PowerShell（黑色視窗）";background:#1B3145;color:#8DBBE4}
body.os-mac .code.term::before{content:"⌨️ 貼到「終端機」"}
.code.term pre{color:#E8E1D4}
.code.term .cmt{color:#8FA3B5}
/* 💬 Claude Code：褐底橘標 */
.code.cc{background:#2B1A11;border-left-color:#D97757}
.code.cc::before{content:"💬 貼給 Claude Code（不是貼到黑色視窗）";background:#3F2718;color:#EDA77C}
.code.cc pre{color:#F3E7DC}
.code.cc .cmt{color:#B08D77}
.code pre{
  font-family:var(--mono);font-size:13.5px;line-height:1.65;
  white-space:pre;
}
/* 圖例 */
.legend{
  display:grid;grid-template-columns:1fr 1fr;gap:11px;
  margin:26px 0 4px;
}
.legend div{
  border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.6;
  border-left:5px solid transparent;
}
.legend .lg-term{background:#0F1D29;color:#C9D9E8;border-left-color:#4A87C4}
.legend .lg-cc{background:#2B1A11;color:#EBD5C4;border-left-color:#D97757}
.legend b{display:block;font-size:14.5px;margin-bottom:3px}
.legend .lg-sub{margin-top:9px}
/* 🔴 .legend b 的特異性(0,1,1) 壓過 .win-only(0,1,0)，要明確蓋掉，
   否則 Mac 模式會留下一行沒有內文的孤兒標題 */
.legend b.win-only,.legend b.mac-only{display:none}
body.os-win .legend b.win-only{display:block}
body.os-mac .legend b.mac-only{display:block}
.legendwrap{margin:4px 0 30px}
.legend-title{font-size:15.5px;font-weight:800;color:var(--navy)}
code.inl2{
  font-family:var(--mono);font-size:12.5px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  padding:1px 5px;border-radius:4px;
}
.legend .lg-term b{color:#8DBBE4}
.legend .lg-cc b{color:#EDA77C}
@media(max-width:640px){ .legend{grid-template-columns:1fr} }
.copy{
  position:absolute;top:33px;right:9px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#E8E1D4;font:inherit;font-size:12px;font-weight:700;
  padding:5px 11px;border-radius:7px;cursor:pointer;
}
.copy:hover{background:rgba(201,162,75,.3);border-color:var(--gold)}
.copy.ok{background:var(--green);border-color:var(--green);color:#fff}
code.inl{
  font-family:var(--mono);font-size:13.5px;
  background:var(--ivory-2);border:1px solid var(--line);
  padding:1px 6px;border-radius:5px;color:var(--navy);
}
/* 可以一鍵複製的行內指令：用跟黑框同一套顏色，看到深色就是「貼到黑視窗」 */
code.inl.cp{
  background:#0F1D29;border-color:#28455F;color:#E8E1D4;
  cursor:pointer;padding:3px 26px 3px 9px;position:relative;
  display:inline-block;line-height:1.5;
  border-left:3px solid #4A87C4;
  user-select:all;
}
code.inl.cp::after{
  content:"⧉";position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:12.5px;color:#8DBBE4;
}
code.inl.cp:hover{background:#16293A;border-color:#4A87C4}
code.inl.cp:active{transform:translateY(1px)}
code.inl.cp.ok{background:#1E4635;border-color:#3E8C63;border-left-color:#5DA87C}
code.inl.cp.ok::after{content:"✓";color:#9FE0BC}

/* ---------- 指令填空欄 ---------- */
.fillbox{
  background:var(--ivory-2);border:1px solid var(--gold);border-radius:11px;
  padding:12px 14px;margin-bottom:8px;
}
.fillbox-title{font-size:13.5px;font-weight:800;color:var(--gold-deep);margin-bottom:9px;line-height:1.5}
.fillbox label{display:block;font-size:13.5px;font-weight:700;color:var(--navy)}
.fillbox label+label{margin-top:10px}
.fillbox input{
  display:block;width:100%;margin-top:5px;box-sizing:border-box;
  font-family:var(--mono);font-size:15px;
  padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;
  background:#fff;color:var(--navy);outline:none;
}
.fillbox input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.16)}
.fillhint{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.6}
/* 指令裡等著被代入的那一段 */
.ph{
  background:rgba(201,162,75,.30);border-radius:3px;padding:0 3px;
  border-bottom:1.5px dashed rgba(201,162,75,.95);
}
.ph.filled{background:rgba(74,140,104,.32);border-bottom:1.5px solid rgba(120,200,160,.9)}

/* ---------- callouts ---------- */
.note{border-radius:11px;padding:13px 15px;font-size:14.5px;line-height:1.7;border:1px solid}
.note b{display:block;margin-bottom:3px;font-size:14.5px}
.note.warn{background:var(--red-bg);border-color:#EBC9C6;color:#7A1C16}
.note.warn b{color:var(--red)}
.note.tip{background:var(--green-bg);border-color:#C4DDD0;color:#1F4C38}
.note.tip b{color:var(--green)}
.note.info{background:var(--blue-bg);border-color:#C9D6E2;color:#294057}
.note.info b{color:var(--navy)}

/* ---------- verify block ---------- */
.verify{
  background:var(--ivory-2);border:1px dashed var(--gold);border-radius:11px;padding:13px 15px;font-size:14.5px;
}
.verify b{color:var(--gold-deep);display:block;margin-bottom:4px}

/* ---------- ask-claude block ---------- */
.askclaude{border:0;padding:0}
.askclaude .ac-head{display:none}

/* ---------- os visibility ---------- */
.win-only,.mac-only{display:none}
body.os-win .win-only{display:block}
body.os-mac .mac-only{display:block}
body.os-win li.win-only,body.os-mac li.mac-only{display:list-item}
body.os-win span.win-only,body.os-mac span.mac-only{display:inline}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14.5px}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--ivory-2);font-weight:800;font-size:13.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}

/* ---------- 步驟卡裡的「備援」摺疊區 ---------- */
.step-body details{background:var(--ivory-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
.step-body details[open]{border-color:var(--gold)}
.step-body summary{font-size:14px;font-weight:700;color:var(--muted)}
.step-body details[open] summary{color:var(--gold-deep);margin-bottom:6px}
.step-body details .ans>*+*{margin-top:11px}

/* ---------- faq ---------- */
details{
  background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:13px 16px;margin-bottom:9px;
}
details[open]{border-color:var(--gold)}
summary{
  cursor:pointer;font-weight:700;font-size:15.5px;list-style:none;
  display:flex;justify-content:space-between;gap:12px;align-items:center;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--gold-deep);font-weight:800;flex:0 0 auto}
details[open] summary::after{content:"－"}
details .ans{margin-top:11px;font-size:15px;color:#33475C}
details .ans>*+*{margin-top:10px}

/* ---------- footer ---------- */
footer{
  margin-top:64px;padding:30px 16px;text-align:center;
  border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;
}
footer strong{color:var(--navy)}

@media(max-width:640px){
  .hero{padding:34px 16px 30px}
  .hero h1{font-size:24px}
  .chapter-head h2{font-size:21px}
  .step{padding:16px 15px 14px}
  .step-body{padding-left:0;margin-top:12px}
  .step-title{font-size:16.5px}
  .code{padding:38px 15px 42px 15px}
  .copy{top:auto;bottom:8px;right:9px}
  .code::before{font-size:12px;padding:7px 12px 6px}
  .progtext{display:none}
  .bar-inner{padding:8px 12px;gap:10px;flex-wrap:nowrap}
  .osswitch button{padding:5px 12px;font-size:13px}
  .resetbtn{display:none}
  .navchips{margin-top:16px}
  .navchips a{padding:6px 12px;font-size:13px}
}
.footreset{
  border:1px solid var(--line);background:#fff;color:var(--muted);
  font:inherit;font-size:13px;padding:7px 15px;border-radius:8px;cursor:pointer;margin-top:14px;
}
.footreset:hover{border-color:var(--gold);color:var(--gold-deep)}
/* ---------- 問卷頁（樣式底沿用安裝教學站） ---------- */
.hero{padding-bottom:28px}
.qa-backtop{display:inline-block;margin-bottom:14px;color:#D9CFBD;font-size:15px;text-decoration:none}
.qa-backtop:hover{color:var(--gold)}
.qa-bar{position:sticky;top:0;z-index:20;background:var(--navy);padding:9px 16px 11px;box-shadow:0 2px 8px rgba(19,41,61,.18)}
.qa-bar-inner{max-width:640px;margin:0 auto}
.qa-barrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px;font-size:14px;color:#E6DECF}
.qa-barrow b{color:var(--gold);font-weight:700}
.qa-barback{color:#D9CFBD;font-size:14px;text-decoration:none;white-space:nowrap}
.qa-track{height:7px;border-radius:9px;background:rgba(255,255,255,.17);overflow:hidden}
.qa-fill{height:100%;width:0;background:var(--gold);transition:width .25s}
#qa-stage{max-width:640px;margin:0 auto;padding:18px 14px 56px}
.qa-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px 20px}
.qa-q{font-size:22px;line-height:1.4;font-weight:800;margin-bottom:6px}
.qa-star{color:var(--gold-deep)}
.qa-badge{font-size:14px;color:var(--muted);margin-bottom:12px}
.qa-hint{font-size:16px;line-height:1.6;color:var(--muted);margin-bottom:14px}
.qa-body{display:grid;gap:9px;margin-top:6px}
.qa-optwrap{position:relative}
.qa-opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
.qa-opt:hover{border-color:var(--gold)}
.qa-opt.on{border-color:var(--navy);background:var(--blue-bg)}
.qa-opt.is-cc{border-style:dashed;background:#FDFBF6}
.qa-opt.is-cc.on{border-style:solid;background:var(--blue-bg)}
.qa-opt input{position:absolute;opacity:0;width:1px;height:1px}
.qa-opt input:focus-visible + .qa-tick{outline:3px solid var(--gold);outline-offset:2px}
.qa-tick{flex:none;width:22px;height:22px;border:2px solid #A79B86;border-radius:50%;background:#fff}
input[type=checkbox] + .qa-tick{border-radius:6px}
.qa-opt.on .qa-tick{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 4px #fff}
.qa-optbody{flex:1;min-width:0;display:block}
.qa-opthead{display:block;font-size:17px;font-weight:700;line-height:1.4;color:var(--navy)}
.qa-optsub{display:block;font-size:16px;line-height:1.5;color:var(--muted);margin-top:2px}
.qa-input{font:inherit;font-size:17px;width:100%;padding:13px;border:2px solid var(--line);border-radius:11px;background:var(--ivory);color:var(--navy);outline:none}
.qa-input:focus{border-color:var(--gold);background:#fff}
.qa-long{line-height:1.6;resize:vertical}
.qa-other label{display:block;font-size:16px;color:var(--muted);margin:5px 0}
.qa-other input{font:inherit;font-size:17px;width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:11px;background:var(--ivory);color:var(--navy);outline:none}
.qa-other input:focus{border-color:var(--gold);background:#fff}
.qa-pair{margin-bottom:10px}
.qa-pairlabel{font-size:16px;font-weight:700;margin-bottom:7px}
.qa-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.qa-chip{font:inherit;font-size:16px;font-weight:700;min-height:50px;padding:6px 3px;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);cursor:pointer}
.qa-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.qa-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa-sw{font:inherit;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 3px 6px;color:var(--navy)}
.qa-sw span{display:block;height:36px;width:36px;border-radius:50%;margin:0 auto 5px;border:1px solid rgba(19,41,61,.2)}
.qa-sw em{font-style:normal;font-size:14px;display:block}
.qa-sw.on{border-color:var(--navy);background:var(--blue-bg)}
.qa-picked{font-size:16px;color:var(--muted);margin-top:4px}
.qa-msg{min-height:0;font-size:16px;line-height:1.55;margin-top:10px}
.qa-msg.warn{color:var(--red);font-weight:700}
.qa-msg.good{color:var(--green);font-weight:700}
.qa-nav{display:flex;gap:9px;margin-top:16px}
.qa-primary{font:inherit;font-size:17px;font-weight:800;width:100%;min-height:54px;padding:12px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);box-shadow:0 2px 0 var(--gold-deep);cursor:pointer}
.qa-primary:hover{background:#D8B45E}
.qa-primary.ok{background:var(--green);color:#fff;box-shadow:none}
.qa-next{flex:1;width:auto}
.qa-back{font:inherit;font-size:16px;font-weight:700;min-height:54px;padding:0 17px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);cursor:pointer}
.qa-small{font-size:16px;line-height:1.6;color:var(--muted);margin-top:11px}
.qa-steps{margin:0 0 16px 22px;font-size:16px;line-height:1.7}
.qa-steps li{margin-bottom:5px}
.qa-carry{background:var(--green-bg);color:var(--green);border-radius:11px;padding:12px 14px;font-size:16px;line-height:1.6;margin-bottom:15px}
.qa-carry b{display:block}
.qa-missing{background:#FBF3DF;border-radius:11px;padding:13px 14px;margin-bottom:18px;font-size:16px;line-height:1.6;color:#5F4710}
.qa-missing b{font-size:16px}
.qa-missing ul{list-style:none;margin-top:7px;display:grid;gap:6px}
.qa-jump{font:inherit;font-size:15px;font-weight:700;width:100%;text-align:left;padding:9px 11px;min-height:44px;border:1px solid #E0CD9D;border-radius:9px;background:#fff;color:var(--navy);cursor:pointer}
.qa-copy{margin-top:8px}
.qa-aftert{font-size:16px;font-weight:800;margin-top:19px}
.qa-after{margin:6px 0 0 22px;font-size:16px;line-height:1.65}
.qa-after code{font-family:inherit;font-weight:700;background:var(--ivory);padding:1px 5px;border-radius:5px}
.qa-phone{background:var(--blue-bg);border-radius:11px;padding:12px 14px;font-size:16px;line-height:1.6;margin-top:16px}
.qa-phone b{display:block}
.qa-share{font:inherit;font-size:15px;font-weight:700;display:block;width:100%;min-height:44px;margin-top:8px;border:1px solid var(--navy);border-radius:9px;background:#fff;color:var(--navy);cursor:pointer}
.qa-pltitle{display:block;font-size:16px;font-weight:700;margin:18px 0 6px}
.qa-prompt{font:inherit;font-size:16px;line-height:1.65;width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--ivory);color:var(--navy);resize:vertical}
.qa-endnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.qa-link{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:9px 0}
/* 選項示意 */
.viz-len{flex:none;width:46px;display:grid;gap:3px}
.viz-len i{display:block;height:3px;background:#A79B86;border-radius:2px}
.viz-ratio{flex:none;display:block;border:2px solid var(--navy);border-radius:4px;background:var(--ivory-2)}
.r916{width:27px;height:48px}
.r11{width:40px;height:40px}
.r169{width:56px;height:32px}
.viz-pace{flex:none;display:flex;width:64px;height:40px;border-radius:6px;overflow:hidden;background:var(--navy);position:relative}
.viz-pace i{flex:1;opacity:.15;background:var(--gold);animation:qaflash 4s steps(1) infinite}
.viz-pace i:nth-child(2){animation-delay:1s}
.viz-pace i:nth-child(3){animation-delay:2s}
.viz-pace i:nth-child(4){animation-delay:3s}
.pace-f i{animation-duration:1.2s}
.pace-f i:nth-child(2){animation-delay:.3s}
.pace-f i:nth-child(3){animation-delay:.6s}
.pace-f i:nth-child(4){animation-delay:.9s}
.pace-m i{animation-duration:2.8s}
.pace-m i:nth-child(2){animation-delay:.7s}
.pace-m i:nth-child(3){animation-delay:1.4s}
.pace-m i:nth-child(4){animation-delay:2.1s}
.pace-s i{animation-duration:6s}
.pace-s i:nth-child(2){animation-delay:1.5s}
.pace-s i:nth-child(3){animation-delay:3s}
.pace-s i:nth-child(4){animation-delay:4.5s}
@keyframes qaflash{0%{opacity:1}25%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.viz-pace i{animation:none;opacity:.5}}
.viz-pos{flex:none;display:block;position:relative;width:44px;height:74px;border-radius:6px;background:var(--navy);overflow:hidden}
.viz-pos b{position:absolute;left:15px;top:11px;width:14px;height:14px;border-radius:50%;background:#D9CFBD}
.viz-pos em{position:absolute;font-style:normal;font-size:12px;font-weight:700;line-height:1.2;background:var(--gold);color:var(--navy);border-radius:3px;padding:1px 3px;white-space:nowrap}
.pos-b em{left:8px;bottom:5px}
.pos-m em{left:8px;bottom:22px}
.pos-f em{left:1px;top:28px}
.viz-font{flex:none;font-size:20px;color:var(--navy);white-space:nowrap}
.f-sans{font-family:qf-sans}
.f-round{font-family:qf-round}
.f-heavy{font-family:qf-heavy}
.f-hand{font-family:qf-hand}
.f-serif{font-family:qf-serif}
@media (max-width:480px){.qa-q{font-size:21px}.viz-font{font-size:19px}.hero .meta{display:none}}
.unlocked .qa-backtop{display:none}
button,.qa-opt,a{touch-action:manipulation}
.hero p{font-size:16px}
.hero .kicker{font-size:14px}
.qa-missing summary{font-weight:700;cursor:pointer;padding:6px 0;min-height:36px}

  var gate = document.getElementById('gate'), form = document.getElementById('gate-form'), input = document.getElementById('gate-input'),
      btn = document.getElementById('gate-btn'), msg = document.getElementById('gate-msg'), app = document.getElementById('app');
  function b64(s){ var bin = atob(s), buf = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i); return buf; }
  async function unlock(pass, silent){
    var subtle = window.crypto && window.crypto.subtle;
    if(!subtle){ msg.className = 'gate-msg err'; msg.textContent = '這個瀏覽器太舊了，請改用 Chrome 或 Safari 開這一頁。'; return false; }
    try{
      var mat = await subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
      var key = await subtle.deriveKey({ name:'PBKDF2', salt:b64(DATA.salt), iterations:DATA.iter, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      var plain = await subtle.decrypt({ name:'AES-GCM', iv:b64(DATA.iv) }, key, b64(DATA.ct));
      app.innerHTML = new TextDecoder().decode(plain);
      gate.style.display = 'none'; document.body.classList.add('unlocked');
      try{ localStorage.setItem('meowdad-qa-pass', pass); }catch(e){}
      (new Function(document.getElementById('qa-js').textContent))();
      return true;
    }catch(e){
      if(window.console) console.warn(e);
      if(!silent){ msg.className = 'gate-msg err'; msg.textContent = '密碼不對，再試一次'; input.value = ''; input.focus(); }
      return false;
    }
  }
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var v = input.value.trim(); if(!v) return;
    btn.disabled = true; msg.className = 'gate-msg'; msg.textContent = '解鎖中…';
    var ok = await unlock(v, false);
    if(!ok) btn.disabled = false;
  });
  (async function(){
    var tried = false;
    for(var i = 0; i < KEYS.length; i++){
      var s = null; try{ s = localStorage.getItem(KEYS[i]); }catch(e){}
      if(!s) continue;
      tried = true;
      if(await unlock(s, true)) return;
    }
    gate.style.display = '';
  })();
